name: data-eng
version: 3
description: Data and analytics engineering with Data TDD (dbt, Dataform, Spark) - proposal → impact → specs → design → validation → rollout → tasks → apply → evidence; logic tests on isolated fixtures written and watched failing against stub models behind a red gate, rigor set by a declared tier, the dataset contract as living spec
artifacts:
  - id: proposal
    generates: proposal.md
    description: Business decision served, consumers and scope of the data change
    template: proposal.md
    instruction: |
      Create the proposal that establishes WHY this data change is needed.

      Sections:
      - **Why**: the business decision or product this dataset, model or metric serves,
        and what is wrong or missing today. 1-3 sentences.
      - **What Changes**: bullet list of datasets, models, metrics and pipelines created,
        modified or removed. Mark breaking changes with **BREAKING**.
      - **Capabilities**: one capability per dataset or metric whose CONTRACT is created
        or changes. Use a kebab-case path nested by data domain, following the project's
        existing layout (e.g., `sales/orders-daily`, `finance/gross-margin-metric`).
        - **New Capabilities**: new datasets or metrics. Each becomes
          specs/<domain>/<name>/spec.md.
        - **Modified Capabilities**: existing ones whose contract changes. Use the exact
          path from openspec/specs/ (confirm with `openspec list --specs`).
        - **Retired datasets**: when the change removes a dataset entirely (every
          requirement REMOVED), set `retire_capabilities: true` in this change's
          `.openspec.yaml`, so archive deletes its main spec instead of stopping.
      - **Consumers**: who reads the output (dashboards, models, teams, exports).
      - **Scope / Non-scope**: what this change explicitly does not touch.

      Use the project context from openspec/config.yaml (rendered as the <project_context>
      block when configured): it names the stack (dbt, Dataform or Spark), the warehouse
      and the conventions.
    requires: []

  - id: impact
    generates: impact.md
    description: Upstream and downstream impact, change classification and the tier that sets the rigor of every later artifact
    template: impact.md
    instruction: |
      Create impact.md. It classifies the change and declares the TIER that decides how
      much rigor every later artifact requires. This is the most important artifact of
      the schema: read the code, the lineage and the sources before filling it.

      CLASSIFICATION (machine-read lines; keep keys and values in English, exactly):
      - `Change class: additive | column | model-wide`
        - additive: new columns, new tables or new rows with no change to existing values.
        - column: an existing column is removed, renamed, retyped or recomputed.
        - model-wide: the grain changes, or a filter, join or GROUP BY changes which rows
          or how many rows the model returns.
      - `Breaking contract change: yes | no`: yes when an existing consumer can break
        or silently receive different values (column removed, renamed or retyped, grain
        changed, constraint tightened, SLA loosened). Adding a column is NOT breaking.
      - `New columns: yes | no`
      - `New PII: yes | no`: any new field that identifies or can re-identify a person.
      - `Backfill: yes | no`: historical partitions must be recomputed or filled.
      - `Critical consumer: yes | no`: a consumer whose error has financial, regulatory or
        executive impact (finance close, pricing engine, regulatory report, board metric).
      - `Tier: T1 | T2 | T3`

      TIER DERIVATION. The declared tier MUST be at least the highest of:
      - T1: additive change with every other line `no`.
      - T2: `Change class: column`, or `Breaking contract change: yes`, or
        `New PII: yes`, or `Backfill: yes`.
      - T3: `Change class: model-wide`, or `Critical consumer: yes`.
      You may declare a higher tier than derived; never a lower one. Explain the tier in
      Tier Rationale. The tier is a hypothesis: if the diff during apply shows effects
      beyond what is declared here, the tier goes up and the affected artifacts reopen.

      Sections:
      - **Classification**: the lines above.
      - **Tier Rationale**: which criterion set the tier.
      - **Upstream** (required from T2): input contracts the change relies on, and
        profiling of the sources: key uniqueness, null rates, orphans in joins, value
        ranges, arrival delay. Profile with queries and record the numbers.
      - **Downstream** (required from T1): column-level lineage of what this change
        touches, and the named consumers (dashboards, models, exports, teams) with owners.

      RIGOR RULE (applies to every artifact of this schema): each template section carries
      a `required:` comment. When the declared tier is at or above it, the section must be
      filled. Below it, the section may contain `N/A: <reason>` with a real reason. Never
      leave a section empty and never write a bare `N/A`.
    requires:
      - proposal

  - id: specs
    generates: "specs/**/*.md"
    description: The dataset or metric contract written as requirements with data-assertable scenarios; becomes the living spec of the dataset
    template: spec.md
    instruction: |
      Write the CONTRACT of each dataset or metric listed in the proposal as requirements.
      At archive time these become the living spec of the dataset in openspec/specs/.
      Use the vocabulary of the Open Data Contract Standard (ODCS 3.2 or later).

      One spec file per capability, at the exact path from the proposal:
      specs/<domain>/<name>/spec.md (or the project's existing layout). Do not move or
      rename an existing capability.
      - New dataset or metric: write the full contract under `## ADDED Requirements`.
      - Existing one: write only the clauses this change touches, as a delta. MODIFIED
        must copy the ENTIRE existing requirement block from openspec/specs/ and edit it.
        REMOVED must include **Reason** and **Migration**. Adding a column usually
        MODIFIES the schema requirement; that is still an additive change.

      Contract clauses (one requirement each; tier from which the clause is mandatory
      when the change touches it):
      - Grain and primary key (T1).
      - Columns: name, logical type, required or nullable (T1).
      - PII classification and retention of each new or changed column (T1). NEVER omit
        this for a new column, even when the answer is "no PII".
      - Data quality rules with severity (T1).
      - SLA: latency, refresh frequency, time to detect a failure (T2).
      - Compatibility policy and active version (T2).
      - Metric definition: type, measure, filter, exclusions, dimensions (whenever the
        dataset publishes a metric).
      - Owner and support channel (T1).

      Reference the executable contract on its own line inside the relevant requirement:
      `Contract: <contractId>@<version>` when the project uses ODCS, otherwise the path
      of the enforcement artifact (dbt model contract, Dataform declaration, Spark schema).
      The spec is the source of the REQUIREMENT; the executable contract in the data repo
      is the source of ENFORCEMENT. They must agree.

      Format rules:
      - `### Requirement: <name>` with SHALL/MUST text.
      - ONE clause per requirement. Keep the description (text between the requirement
        header and its first scenario) at 500 characters or fewer: `openspec validate
        --strict` fails above that. Put column lists and value sets in scenarios or in the
        executable contract, not in the requirement text. Under MODIFIED, never trim
        existing text just to meet the limit.
      - `#### Scenario: <name>` (exactly 4 hashtags) with WHEN/THEN bullets.
      - Every requirement needs at least one scenario, and every scenario must be
        assertable against data: a count, a uniqueness check, a null rate, a value set,
        a freshness timestamp, a reconciliation within a threshold.
        Good: "THEN each (order_id, order_date) appears exactly once".
        Bad: "THEN the data is correct".
      - Scenario names must be unique within the change; validation.md references them.
      - Data TDD: write scenarios about transformation output (grain, values, derived
        fields, metric results) so they can be tested on a small fixture: name the input
        situation in WHEN (e.g., "WHEN two orders share an order_id") and the exact
        expected output in THEN. Metadata and operational clauses (PII tag, owner, SLA)
        are verified by the contract or a monitor.
    requires:
      - impact

  - id: design
    generates: design.md
    description: Model interface (the stubs' schema), materialization, incremental strategy, field mapping, idempotency, orchestration and cost
    template: design.md
    instruction: |
      Create design.md: HOW the data will be produced. Follow the RIGOR RULE from
      impact.md (each section's `required:` comment against the declared tier).

      Sections:
      - **Model Interface** (required from T1): one row per model this change creates or
        changes: model name, file, and the output schema (column, type, nullable) taken
        from the contract in specs/. The red gate creates STUB models with exactly this
        schema, so it must be concrete and complete.
      - **Materialization** (required from T1): one machine-read line
        `Materialization: table | view | incremental | ephemeral | streaming`, plus layer
        (staging, intermediate, mart) and partitioning or clustering.
      - **Incremental Strategy and Late Data** (required from T1): unique key, merge or
        insert-overwrite, the lookback window, and how late-arriving rows are handled.
        `N/A: <reason>` only when not incremental.
      - **Field Mapping** (required from T1): a table with one row per new or changed
        target field: target field, source fields, transformation, and kind
        (`mapped` | `audit` | `system-generated`). Every published field must be one of
        the three.
      - **Idempotency and Reprocessing** (required from T2): what happens if a run is
        repeated or a partition is reprocessed; how duplicates are prevented.
      - **Orchestration** (required when the schedule, dependencies or retries change).
      - **Cost Estimate** (required from T2, and always when `Backfill: yes`): bytes or
        compute per run and for the backfill, with the method of estimation.
      - **Decisions**: key choices with alternatives considered.
      - **Risks / Trade-offs**: format `[Risk] -> Mitigation`.
      - **Open Questions**: anything unresolved. Questions that would change what gets
        built MUST be resolved with the user before tasks are written.
    requires:
      - specs

  - id: validation
    generates: validation.md
    description: Data TDD test plan - every contract scenario mapped to its evidence, each with the break it must catch; doubles as the red/green ledger
    template: validation.md
    instruction: |
      Create validation.md: the Data TDD test plan, written BEFORE any model code. It maps
      every contract scenario to evidence and doubles as the live ledger.

      Evidence types:
      - `logic-test`: the transformation logic tested on a STATIC FIXTURE (input rows plus
        expected output rows). The only evidence that can be red before the model exists:
        against a stub that returns zero rows it fails by assertion.
      - `data-test`: an assertion on the built table (uniqueness, not null, accepted
        values, relationships, row conditions). Runs after the build.
      - `contract`: the executable contract enforced at build time.
      - `reconciliation` (required from T2): a query against a source of truth with a
        numeric threshold (e.g., row count parity 0.1%, metric parity 0.05%).
      - `diff` (required from T2): dev or shadow output against production.
      - `monitor` (required from T2): a production monitor enforcing an SLA from the spec.

      DATA TDD RULES:
      1. Every scenario about TRANSFORMATION OUTPUT (grain, column values, derived fields,
         metric definitions, quality rules that the logic must guarantee) MUST have at
         least one `logic-test`. Scenarios about metadata or operations (PII tag, owner,
         SLA, freshness) use `contract` or `monitor` evidence instead; mark them
         `Evidence type: contract` or `monitor`.
      2. One fixture per test, stored next to the test, never shared between tests:
         changing a shared fixture for one test silently breaks another.
      3. Every changed model has a GRAIN logic test: its fixture contains a duplicated
         input key or a one-to-many join partner, and its expected output has exactly one
         row per grain key. This catches fan-out from joins.
      4. For every test, write **Breaks if**: the concrete fault it must catch. Either a
         model mutation (drop a join condition, LEFT instead of INNER join, remove a
         filter, shift a date window by one day, COALESCE removed, wrong aggregate) or a
         data mutation in the fixture (duplicate key, null in a required column, value
         outside the accepted set, orphan foreign key, late-arriving row). If you cannot
         name one, the test checks nothing; redesign it.
      5. For every logic test, write **Expected red**: the assertion failure expected
         against the stub (expected N rows, got 0; expected value X, got null).
      6. VACUOUS TESTS: uniqueness, not-null, accepted-values and relationship tests pass
         on an empty table. Mark each such data test `Vacuous on empty: yes`, and make sure
         its scenario also has a non-vacuous row: a logic test, a minimum row count, or a
         reconciliation.
      7. Do not trust that the framework compares every column or counts duplicates. Some
         versions have silent-pass cases (e.g., dbt Fusion ignoring TIMESTAMP columns in
         `expect`, or columns absent from the first expected row). The mutation check in
         apply is what proves a test can catch a wrong value.

      Stack equivalents (use the stack named in the project context):
      | Mechanism | dbt | Dataform | Spark / PySpark |
      | logic-test | unit test with given/expect (dbt 1.8+) | unit test in a .sqlx with type "test" and mocked input | pytest with fixture DataFrames and assertDataFrameEqual (PySpark 3.5+) |
      | stub model | model selecting typed NULL columns with `where false` | SQLX selecting typed NULL columns with `where false` | function returning `spark.createDataFrame([], schema)` |
      | data-test | data tests | built-in assertions (nonNull, uniqueKey, rowConditions) and manual assertions | check queries on the materialized table |
      | contract | model contract with enforced: true; ODCS when adopted | declared schema plus assertions; ODCS when adopted | explicit StructType checked with assertSchemaEqual; ODCS when adopted |
      | versioning | model versions (latest_version, deprecation_date) | versioned table name plus a stable public view | versioned table name plus a stable public view |
      | diff | Recce, data-diff or a comparison query | comparison query | DataFrame comparison |

      Sections:
      - **Stack and Commands**: stack, and the exact commands to run logic tests, build,
        data tests and contract checks, and the mutation tool if any (else "manual").
      - **Ledger**: one row per (scenario, evidence). Columns:
        `| ID | Capability | Scenario | Evidence type | Check | Fixture | Breaks if | Vacuous on empty | Threshold | Red (SHA: failure) | Observed | State |`
        IDs are `V1`, `V2`, ... and tasks.md references them as `[ledger: V1]`.
        State starts as `planned`. It becomes `red` ONLY with the red commit SHA and the
        observed failure excerpt, and `green` ONLY with an observed result. Rows that
        cannot run before the build (data-test, contract, reconciliation, diff, monitor)
        go from `planned` straight to `green` after the build.
      - **Reconciliation** (required from T2): source of truth, query, threshold.
      - **Diff Plan** (required from T2): what is compared, at which level, and what result
        would contradict the impact classification.
      - **SLA Monitors** (required from T2): monitor, threshold, alert channel.
      - **Test Changes After Red**: append-only log, empty at planning. Any change to a
        test or fixture after the red commit is recorded here with the reason and the
        spec change that justifies it.
    requires:
      - specs
      - design

  - id: rollout
    generates: rollout.md
    description: Release strategy by change class, historical values decision, backfill, consumer migration, approvals and runbook
    template: rollout.md
    instruction: |
      Create rollout.md: how the change reaches production without breaking consumers.
      Follow the RIGOR RULE from impact.md.

      Sections:
      - **Strategy by Class** (required from T1):
        - additive: direct deploy after validation.
        - column: new version or new column alongside the old one, a deprecation date,
          and the migration of each named consumer.
        - model-wide: shadow run, reconciliation, cutover by swapping a view or alias,
          and a rollback window.
      - **Historical Values** (required from T1 whenever `New columns: yes`; NEVER N/A
        when the model is incremental and gains a column): decide whether historical rows
        keep NULL in the new column or are backfilled, and state what consumers will see.
      - **Backfill Plan** (required when `Backfill: yes`): partitions or window, source of
        truth, write strategy (merge or overwrite), dry run, publication paused during the
        backfill, cost ceiling, and the reconciliation thresholds that gate publication.
      - **Consumer Migration and Deprecation** (required from T2): per consumer, what
        changes, the deadline, and who confirms.
      - **Shadow Run and Cutover** (required from T3).
      - **Rollback** (required from T1): how to revert. From T3 the rollback must be
        tested before cutover.
      - **Approvals** (required from T2): dataset owner and downstream owners, as
        required vs granted.
      - **Retirement** (required when a dataset is removed entirely): consumers migrated,
        date the table is dropped, and confirmation that `retire_capabilities: true` is set
        in `.openspec.yaml`. Otherwise `N/A: <reason>`.
      - **Alerts and Runbook** (required from T3): alerts, on-call, first steps when the
        dataset is late or wrong.
    requires:
      - impact
      - design
      - validation

  - id: tasks
    generates: tasks.md
    description: Checklist that opens with the Data TDD red gate (logic tests, fixtures and stub models, watched failing, committed, approved) before any model logic
    template: tasks.md
    instruction: |
      Create the task list. The apply phase parses `- [ ]` checkboxes; a box holding only
      `x` counts as done, every other marker (including `- [~]`) reads as unfinished.

      Before writing tasks, check design.md Open Questions. Resolve with the user any that
      would change what gets built.

      MANDATORY STRUCTURE:

      `## 0. Red gate` comes first and is copied from the template:
      - 0.1 write every logic test with its own fixture, the data tests and the
        executable contract, and a STUB for every model in Model Interface (exact output
        schema, zero rows, no logic);
      - 0.2 run the logic tests; every one must FAIL BY ASSERTION against the stubs;
        record each failure excerpt in the ledger; run the data tests on the stubs and
        confirm the ones marked `Vacuous on empty: yes` are the ones that pass;
      - 0.3 commit tests, fixtures, contract and stubs only, message
        `test(red): <change-name>`, and write the SHA in the ledger;
      - 0.4 STOP: show the user the failing tests and wait for explicit approval. This
        task is completed only by the user's OK.

      Then one `## N. <model>` group per model or slice:
      - Each task references its ledger items: `- [ ] N.M Description [ledger: V1, V2]`.
      - Each task states how it is verified (which ledger rows turn green, which command).
      - Each group lands the inner-loop unit tests its own logic calls for (macros, UDFs,
        PySpark functions), one test at a time.
      - Each group ends with: build with contract enforced; data tests green; refactor
        keeping everything green.

      Then `## N. Integration evidence` (from T2): reconciliation and diff.

      Then `## N. Verification`: one mutation check per changed model, plus one per
      contract clause touched from T2 (apply a "Breaks if" mutation, see its test fail,
      revert); a fresh full run of logic tests, build with contracts and data tests.

      Then `## N. Rollout`: steps from rollout.md. Steps that touch production (backfill,
      cutover, dropping or renaming a table) are separate tasks and say "with explicit
      user confirmation".

      Put untracked follow-up (produce evidence.md, archive) as plain bullets in an
      optional `## Workflow follow-up` section at the end.
    requires:
      - rollout

  - id: evidence
    generates: evidence.md
    description: Post-implementation evidence that Data TDD happened - red gate replay, test freeze, mutation checks, build and data tests, reconciliation, decision
    template: evidence.md
    instruction: |
      PRECHECK - this artifact is written AFTER apply, never during planning. The
      `requires: [tasks]` edge exists only for graph order. Before writing anything, run
      all three checks from the project root. If any fails, STOP and tell the user that
      apply has not finished; do not create evidence.md.
      1. A red commit exists (must print a SHA):
         git log --format=%h --grep='^test(red)' -n 1
      2. Implementation happened after it (must be > 0):
         git rev-list --count <red-sha>..HEAD
      3. No unchecked task remains in tasks.md (must be 0):
         grep -cE '^\s*([-*+]|[0-9]+[.)]) \[ \]' openspec/changes/<change-name>/tasks.md

      Then produce evidence.md, recording commands and results:
      - **Red Gate Replay**: in a temporary git worktree at the red SHA (or a clean
        checkout of it), run the logic tests and confirm each fails by assertion against
        the stubs. If the project cannot run there, record why and cite the excerpts from
        task 0.2; mark it as weaker evidence.
      - **Test Freeze**: `git diff <red-sha>..HEAD --stat -- <test and fixture files>`.
        Every change listed must match an entry in validation.md "Test Changes After Red".
        An unexplained change is a FAIL.
      - **Mutation Checks**: per changed model (and per contract clause touched from T2):
        the mutation applied, the test that caught it, confirmation it was reverted. A
        mutation no test caught is a FAIL.
      - **Build and Tests**: exact commands, fresh run, results of logic tests, build with
        contracts and data tests.
      - **Reconciliation and Diff** (from T2): observed value against threshold; whether
        the diff stayed inside what impact.md declared.
      - **TDD Path**: `TDD path: superpowers | embedded` (which rules guided the inner loop).
      - **Decision**: exactly one line `DECISION: PASS` or `DECISION: FAIL`, followed by
        the blocking items when FAIL.

      evidence.md may be regenerated after fixes; each run overwrites it.
    requires:
      - tasks

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    This schema implements data changes with Data TDD, in a double loop. Outer loop: each
    model turns its logic tests green. Inner loop: unit tests for macros, UDFs and
    PySpark functions, one at a time.

    INNER-LOOP RULES: if the skill `superpowers:test-driven-development` is available,
    invoke it for the inner loop only. The red gate (tasks 0.x) is governed by this
    schema: writing all logic tests at once behind the gate is intended. Record which
    path you used in evidence.md (`TDD path:`).

    1. **RED GATE (tasks 0.x)**: write the logic tests with their own fixtures, the data
       tests, the executable contract, and stub models with the exact output schema and
       zero rows. Run the logic tests. Each must FAIL BY ASSERTION: expected rows or
       values versus what the stub returned. Not valid red: compilation errors, missing
       refs, fixture syntax errors. A logic test that passes against a stub tests nothing:
       fix it. Run the data tests on the stubs: only those marked `Vacuous on empty: yes`
       may pass. Commit tests, fixtures, contract and stubs only as
       `test(red): <change-name>`, record the SHA and excerpts in the ledger, then STOP at
       task 0.4 and wait for the user's approval.
    2. **GREEN (outer loop)**: one model at a time, write the minimum logic that turns its
       logic tests green. Commit as `feat(green): <model>`.
    3. **INNER LOOP**: whenever a macro, UDF or function needs logic of its own, write ONE
       unit test, watch it fail, write the minimum code, watch it pass.
    4. **BUILD**: build in dev with the executable contract enforced; run the data tests.
    5. **RECONCILE AND DIFF** (from T2): record the observed value next to the threshold;
       run the diff against production.
    6. **REFACTOR**: after green only; everything stays green.
    7. **MARK**: flip ledger rows with observed evidence only; check off tasks only after
       their rows are green.

    TEST FREEZE: tests and fixtures from the red commit are frozen. Changing an expected
    value, deleting a test, editing a fixture to make it pass, or loosening a threshold is
    a TDD violation. If a test or fixture is genuinely wrong, STOP: amend the spec, append
    an entry to validation.md "Test Changes After Red" with the reason, tell the user, then
    resume.

    TIER CHECK: if the diff shows changed rows, columns or values beyond what impact.md
    declares, STOP. Raise the tier, reopen impact.md, validation.md and rollout.md, and
    tell the user before continuing.

    VERIFICATION GROUP: one mutation check per changed model, plus one per contract clause
    touched from T2. Apply the "Breaks if" mutation (to the model or to the fixture), run
    the tests, confirm a test fails, revert. Then a fresh full run.

    Never:
    - Run a backfill, a cutover, a production DDL, or drop or rename a production table
      without explicit confirmation from the user in this session.
    - Mark a reconciliation green without the observed value recorded.
    - Claim completion without evidence.md saying `DECISION: PASS`.

    FINISHING: when every task is checked, produce the `evidence` artifact
    (`openspec instructions evidence --change <change-name>`).
